<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' https://accounts.google.com; img-src 'self' data:; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://openidconnect.googleapis.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Michi ToDo</title><meta name="theme-color" content="#2e6851"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="assets/app-icon-32.png"><link rel="icon" type="image/x-icon" href="assets/app-icon.ico"><link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon-180.png"><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand"><img class="logo" src="assets/app-icon-192.png" width="43" height="43" alt=""><div>Michi<span>ひとつずつ、前へ。</span></div></div><p class="nav-caption">マイタスク</p><nav aria-label="表示するタスク"><button data-filter="today">☀ <span>今日</span><b></b></button><button data-filter="upcoming">▦ <span>これから</span><b></b></button><button data-filter="all" class="active">☷ <span>すべて</span><b></b></button><button data-filter="completed">✓ <span>完了</span><b></b></button><button data-filter="trash">♧ <span>ごみ箱</span><b></b></button></nav><div class="local" id="connection" role="status"><span class="dot"></span> <span id="connection-title">保存先を確認中</span><small id="connection-detail">接続状態を確認しています。</small></div></aside>
<main><header><div><p id="date" class="eyebrow"></p><h1 id="heading">すべてのタスク</h1><p id="subtitle"></p></div><button id="new" class="primary">＋ タスクを追加</button></header><section class="summary"><div><span>未完了</span><strong id="remaining">0</strong></div><div><span>今日の締切</span><strong id="today-count">0</strong></div><div><span>完了したタスク</span><strong id="done-count">0</strong></div><p>小さな一歩も、<br>ちゃんと前進。</p></section>
<div class="preferences"><button id="sound-toggle" type="button" aria-pressed="true" aria-label="操作音をオフにする" title="操作音をオフにする">♪ 操作音オン</button><button id="motion-toggle" type="button" aria-pressed="true" aria-label="アニメーションをオフにする">動きオン</button><div id="desktop-controls" hidden><button id="desktop-settings">PC機能</button><button id="desktop-compact">今日のミニウィンドウ</button></div></div><div class="syncbar"><span id="sync-status" role="status">この端末に保存</span><div><button id="connect">Google Driveに接続</button><button id="sync" hidden>今すぐ同期</button><button id="disconnect" hidden>切断</button></div></div><div class="toolbar"><label class="search">⌕ <input id="search" type="search" placeholder="タスクを検索" aria-label="タスクを検索"></label><label class="sort">並び順 <select id="sort"><option value="due">締切が近い順</option><option value="priority">優先度順</option><option value="new">追加が新しい順</option></select></label></div><div id="warning" role="alert" hidden></div><div id="list" aria-live="polite"></div><div id="empty" hidden><div>✓</div><h2>ここは、すっきり。</h2><p id="empty-text">やることを追加して、今日の一歩を始めよう。</p></div></main>
<dialog id="editor" aria-labelledby="modal-title"><form id="form"><div class="modal-header"><h2 id="modal-title">新しいタスク</h2><button type="button" id="close" class="icon" aria-label="閉じる">×</button></div><label>タスク名 <span>*</span><input name="title" required maxlength="120" placeholder="例：ポートフォリオを見直す" autocomplete="off"></label><div class="fields"><label>締切日<input type="date" name="due"></label><label>優先度<select name="priority"><option value="normal">ふつう</option><option value="high">高い</option><option value="low">低い</option></select></label></div><label>メモ<textarea name="notes" rows="4" maxlength="5000" placeholder="手順や、覚えておきたいこと"></textarea></label><p class="hint">Web版は締切の一覧表示。PC版の通知は「PC機能」で設定できます。</p><p id="form-error" role="alert"></p><footer><button type="button" id="cancel">キャンセル</button><button class="primary" id="save">保存する</button></footer></form></dialog><div id="toast" role="status" hidden></div><script src="config.js"></script><script src="sync-core.js"></script><script src="drive-sync.js"></script><script src="data-adapter.js"></script><script src="renderer.js"></script></body></html>
